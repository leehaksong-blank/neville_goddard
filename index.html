<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v2 네빌 고다드 294 강의 영어 스튜디오</title>
  <!-- 1. 디자인 도구(Tailwind) 불러오기 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2. React(앱 엔진) 불러오기 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- 3. JSX 번역기(Babel) 불러오기 : 이게 있어야 .jsx 파일이 작동합니다! -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#faf9f5] text-[#292929]">
  <!-- 여기에 앱 화면이 그려집니다 -->
  <div id="root"></div>

  <!-- 4. 우리가 만들 app.jsx 파일을 연결해주는 줄 -->
  <script type="text/babel" src="./app.jsx?v=final"></script>
</body>
</html>
