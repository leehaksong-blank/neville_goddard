<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네빌 고다드 294 강의 실시간 강독 스튜디오</title>
  <!-- 1. 디자인 도구(Tailwind) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2. React 엔진 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- 3. JSX 번역기(Babel) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#faf9f5] text-[#292929]">
  <div id="root"></div>

  <!-- 4. 크롬 등 모든 브라우저에서 캐시/보안 차단 없이 app.jsx를 안전하게 불러오는 로더 -->
  <script>
    fetch('./app.jsx?t=' + Date.now())
      .then(res => {
        if (!res.ok) throw new Error('app.jsx 파일을 찾을 수 없습니다.');
        return res.text();
      })
      .then(code => {
        const compiled = Babel.transform(code, { presets: ['react'] }).code;
        new Function(compiled)();
      })
      .catch(err => {
        document.getElementById('root').innerHTML =
          '<div style="padding:24px;color:#b91c1c;font-weight:bold;">로딩 오류: ' + err.message + '</div>';
      });
  </script>
</body>
</html>
