<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네빌 고다드 294 강의 실시간 강독 스튜디오</title>
  <!-- 1. 디자인 도구(Tailwind) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2. React 엔진 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- 3. JSX 번역기(Babel) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 4. A4 PDF 다운로드(인쇄) 전용 스타일 -->
  <style>
    @media print {
      @page { size: A4; margin: 15mm 14mm; }
      body { background-color: #ffffff !important; }
      .no-print { display: none !important; }
      .print-container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
      .print-card {
        break-inside: avoid;
        page-break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
        margin-bottom: 14px !important;
      }
    }
  </style>
</head>
<body class="bg-[#faf9f5] text-[#292929]">
  <div id="root"></div>

  <script>
    fetch('./app.jsx?t=' + Date.now(), { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('app.jsx 파일을 찾을 수 없습니다.');
        return res.text();
      })
      .then(code => {
        const compiled = Babel.transform(code, { presets: ['react'] }).code;
        const s = document.createElement('script');
        s.type = 'text/javascript';
        s.text = compiled;
        document.body.appendChild(s);
      })
      .catch(err => {
        // 혹시 에러가 나면 백지 화면 대신 원인을 빨간 글씨로 친절하게 표시
        document.getElementById('root').innerHTML =
          '<div style="padding:24px;color:#b91c1c;font-weight:bold;">로딩 오류: ' + err.message + '</div>';
      });
  </script>
</body>
</html>
