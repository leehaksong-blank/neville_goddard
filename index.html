<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네빌 고다드 294 강의 실시간 강독 스튜디오</title>
  <!-- 1. 디자인 도구(Tailwind) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2. React 엔진 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- 3. JSX 번역기(Babel) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#faf9f5] text-[#292929]">
  <div id="root"></div>

  <!-- 4. import/export 에러 자동 제거 + 크롬 완벽 호환 로더 -->
  <script>
    fetch('./app.jsx?t=' + Date.now())
      .then(res => {
        if (!res.ok) throw new Error('app.jsx 파일을 찾을 수 없습니다.');
        return res.text();
      })
      .then(rawCode => {
        // 혹시 app.jsx 안에 import 나 export 문법이 섞여 있어도 자동으로 제거/변환
        const cleanedCode = rawCode
          .replace(/^\s*import\s+.*?from\s+['"].*?['"];?\s*$/gm, '')
          .replace(/^\s*export\s+default\s+/gm, '');

        // Babel로 순수 브라우저용 코드로 컴파일 후 실행
        const compiled = Babel.transform(cleanedCode, {
          presets: ['env', 'react']
        }).code;

        new Function(compiled)();
      })
      .catch(err => {
        document.getElementById('root').innerHTML =
          '<div style="padding:24px;color:#b91c1c;font-weight:bold;">로딩 오류: ' + err.message + '</div>';
      });
  </script>
</body>
</html>
